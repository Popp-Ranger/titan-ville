<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#06070a">
<title>Titan-Ville</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<svg style="position:absolute;width:0;height:0" aria-hidden="true"><defs>
<filter id="b2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
<filter id="b5" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5"/></filter>
<filter id="b12" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="12"/></filter>
<linearGradient id="pl-braise" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a0c05"/><stop offset=".6" stop-color="#c93d14"/><stop offset="1" stop-color="#ffc98a"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffd08a" stop-opacity=".5"/><stop offset="1" stop-color="#ffd08a" stop-opacity="0"/></linearGradient>
<linearGradient id="beamv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dfe9f5" stop-opacity=".45"/><stop offset="1" stop-color="#dfe9f5" stop-opacity="0"/></linearGradient>
<linearGradient id="beamr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff3b4e" stop-opacity=".5"/><stop offset="1" stop-color="#ff3b4e" stop-opacity="0"/></linearGradient>
<linearGradient id="beamu" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#dfe9f5" stop-opacity=".2"/><stop offset="1" stop-color="#dfe9f5" stop-opacity="0"/></linearGradient>
<linearGradient id="beamf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0c0" stop-opacity=".5"/><stop offset="1" stop-color="#fff0c0" stop-opacity="0"/></linearGradient>
<linearGradient id="refl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc76b" stop-opacity=".3"/><stop offset="1" stop-color="#ffc76b" stop-opacity="0"/></linearGradient>
<linearGradient id="cielv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#020304"/><stop offset=".5" stop-color="#0a0e14"/><stop offset=".78" stop-color="#1c1416"/><stop offset=".86" stop-color="#3c1b13"/></linearGradient>
<radialGradient id="fog"><stop offset="0" stop-color="#363e49"/><stop offset=".6" stop-color="#161a20"/><stop offset="1" stop-color="#07080a"/></radialGradient>
<linearGradient id="mist" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14181e" stop-opacity="0"/><stop offset="1" stop-color="#14181e" stop-opacity=".95"/></linearGradient>
<linearGradient id="gnd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#55616f" stop-opacity="0"/><stop offset=".5" stop-color="#55616f" stop-opacity=".8"/><stop offset="1" stop-color="#55616f" stop-opacity="0"/></linearGradient>
</defs></svg>

<div id="app">
  <section id="accueil" class="ecran">
    <div class="t sub">Titan-Ville</div>
    <h1 class="t">Choisis un œuf</h1>
    <p class="lead">Douze espèces. Tu l'élèves, il grandit, la ville le nourrit. Voici ce qu'il deviendra.</p>
    <div id="especes"></div>
  </section>

  <section id="fiche" class="ecran">
    <button class="lien t" data-a="retour">← Les douze espèces</button>
    <div id="fiche-dessin"></div>
    <h1 class="t" id="fiche-nom"></h1>
    <div class="t sub" id="fiche-type"></div>
    <p id="fiche-d"></p>
    <p id="fiche-s"></p>
    <label class="t" for="nom">Son nom</label>
    <input id="nom" maxlength="14" autocomplete="off" spellcheck="false">
    <button class="gros t" data-a="couver">Couver cet œuf</button>
  </section>

  <section id="jeu" class="ecran">
    <header>
      <div class="tete">
        <div><h1 class="t" id="nm"></h1><div class="t sub" id="sub"></div></div>
        <button class="rond" data-a="journal" aria-label="Journal"></button>
      </div>
      <div class="jauges" id="jauges"></div>
      <div class="dep" id="dep"></div>
    </header>
    <main id="main">
      <svg id="scene" viewBox="0 0 300 420" preserveAspectRatio="xMidYMax slice"></svg>
      <div id="meteo" aria-hidden="true"><div id="brume"></div><div id="pluie2"></div><div id="eclair"></div></div>
      <div id="titre" aria-live="polite"><small class="t"></small><b class="t"></b><i></i></div>
      <div id="msg" class="t"></div>
      <div id="fondu" aria-hidden="true"></div>
    </main>
    <footer id="bar"></footer>
  </section>

  <div id="voile"><div id="panneau"></div></div>
</div>

<script src="js/art.js"></script>
<script src="js/core.js"></script>
<script src="js/jeu.js"></script>
</body>
</html>
